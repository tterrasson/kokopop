[project]
name = "kokopop"
version = "0.1.0"
description = "Standalone Kokoro GGML Runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.17.0",
    "kokoro>=0.9.4",
    "torch>=2.12.0",
]

[dependency-groups]
dev = [
    "openai-whisper>=20250625",
    "opencc>=1.3.1",
    "pypinyin>=0.55.0",
    "numpy>=2.4.4",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" }
]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
norecursedirs = ["build", "build-*", ".venv", "_deps"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
